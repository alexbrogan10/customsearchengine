[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customsearchengine"
version = "0.1.0"
description = "An LLM-powered search engine for the command line, built on the Claude API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.3.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cse = "search_engine.cli:main"

[tool.setuptools]
packages = ["search_engine"]
